<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101b2d"><meta name="robots" content="noindex,nofollow"><title>BOĞA KUYUMCULUK | Banka Hesapları</title><style>
*{box-sizing:border-box} :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18253a;background:#f3f5f8}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}header{background:#101b2d;color:white;padding:48px 24px 88px;position:relative;overflow:hidden}header:after{content:"";position:absolute;width:310px;height:310px;border:1px solid #ffffff12;border-radius:50%;right:-110px;top:-160px;box-shadow:0 0 0 42px #ffffff04,0 0 0 84px #ffffff03}.head{max-width:920px;margin:auto;position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:3px;color:#b9c7da;font-weight:700}.identity{display:flex;align-items:center;gap:16px;margin:23px 0 16px}.avatar{width:56px;height:56px;display:grid;place-items:center;border:1px solid #ffffff35;border-radius:18px;background:#ffffff0c;color:#e6d1a6;font-size:20px;font-weight:600}h1{font-size:clamp(26px,5vw,36px);letter-spacing:-1px;margin:0;font-weight:650}.intro{color:#b6c2d3;font-size:14px;line-height:1.7;max-width:500px;margin:0}main{max-width:968px;margin:-42px auto 0;padding:0 24px 30px;position:relative;z-index:2}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{min-width:0;background:white;border-radius:24px;box-shadow:0 8px 30px #16233a0a;overflow:hidden;border:1px solid #e6eaf0}.bank{background:var(--gradient);color:#fff;position:relative;overflow:hidden;padding:25px 24px;min-height:116px;display:flex;align-items:center;justify-content:space-between}.bank:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:24px solid #ffffff08;right:-50px;top:-65px}.bankname{font-size:26px;font-weight:800;letter-spacing:-.7px;position:relative;z-index:1}.bankname small{display:block;font-size:10px;letter-spacing:2.4px;margin-bottom:4px;font-weight:600;opacity:.85}.number{font-size:11px;border:1px solid #ffffff40;border-radius:100px;padding:6px 9px;z-index:1;color:#ffffffcc}.details{padding:24px}.label{font-size:10px;font-weight:700;letter-spacing:1.8px;color:#8791a0;margin:0 0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:650;letter-spacing:.5px}.copyname{border:1px solid #e6eaf0;background:#fff;border-radius:10px;padding:10px;color:#536174;min-height:44px;display:flex;gap:6px;align-items:center;font-size:12px}.ibanbox{margin-top:20px;background:#f5f7fa;border:1px solid #edf0f4;border-radius:14px;padding:17px 15px}.iban{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:600;font-size:clamp(14px,3.5vw,17px);line-height:1.8;letter-spacing:.25px;overflow-wrap:anywhere;user-select:all}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.primary,.whatsapp{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;border-radius:12px;text-decoration:none;font-size:12px;font-weight:650;padding:10px 7px}.primary{background:var(--color);color:white;border:1px solid var(--color)}.whatsapp{color:#167347;background:#f0faf4;border:1px solid #d9efe1}.icon{width:17px;height:17px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}button:hover,a:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible{outline:3px solid #c89639;outline-offset:3px}footer{text-align:center;color:#8490a0;font-size:11px;line-height:1.8;margin:25px 0 0}.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);opacity:0;background:#16263a;color:#fff;border-radius:14px;padding:15px 22px;box-shadow:0 8px 25px #0002;font-size:13px;pointer-events:none;transition:.2s;z-index:10;width:max-content;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:640px){header{padding:35px 20px 76px}main{padding:0 16px 24px}.grid{grid-template-columns:1fr;gap:18px}.bank{padding:22px;min-height:104px}.details{padding:21px}.identity{margin-top:20px}.intro{font-size:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="head"><div class="eyebrow">BANKA HESAP BİLGİLERİ</div><div class="identity"><div class="avatar" aria-hidden="true">YB</div><h1>BOĞA KUYUMCULUK</h1></div><p class="intro">Bankanızı seçin, hesap bilgilerini tek dokunuşla kopyalayın veya WhatsApp üzerinden paylaşın.</p></div></header>
<main><div class="grid" id="accounts"></div><noscript>Hesap kartlarını görüntülemek için tarayıcınızda JavaScript’i etkinleştirin.</noscript><footer>Havale / EFT işlemleriniz için hesap bilgileri.<br>Göndermeden önce alıcı bilgilerini kontrol ediniz.</footer></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const owner='YAHYA BOĞA';
const banks=[
{name:'Akbank',display:'AKBANK',subtitle:'',iban:'TR850004600334888000125179',color:'#d91020',gradient:'linear-gradient(120deg,#c90718,#ef2536)'},
{name:'TEB',display:'TEB',subtitle:'TÜRK EKONOMİ BANKASI',iban:'TR930003200000000084636664',color:'#008b64',gradient:'linear-gradient(120deg,#007c59,#00ac7d)'},
{name:'QNB Finansbank',display:'QNB',subtitle:'FİNANSBANK',iban:'TR330011100000000044586061',color:'#152c52',gradient:'linear-gradient(115deg,#082c52 15%,#23385c 60%,#861548)'},
{name:'Türkiye İş Bankası',display:'İş Bankası',subtitle:'TÜRKİYE',iban:'TR130006400000160004449502',color:'#00539b',gradient:'linear-gradient(120deg,#003e77,#0866ac)'}
];
const copyIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>';
const shareIcon='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a9 9 0 0 1-13.5 7.8L3 21l1.5-4.7A9 9 0 1 1 21 11.5Z"/><path d="M8 7c0 5 4 9 9 9l1-2-3-2-1 1c-1.5-.5-2.5-1.5-3-3l1-1-2-3Z"/></svg>';
const formatted=iban=>iban.match(/.{1,4}/g).join(' ');
document.getElementById('accounts').innerHTML=banks.map((b,i)=>`<article class="card" style="--color:${b.color};--gradient:${b.gradient}" aria-label="${b.name} hesap bilgileri"><div class="bank"><div class="bankname">${b.subtitle?`<small>${b.subtitle}</small>`:''}${b.display}</div><span class="number">0${i+1}</span></div><div class="details"><p class="label">ALICI ADI</p><div class="row"><span class="name">${owner}</span><button class="copyname" data-copy="name" data-bank="${i}" aria-label="${b.name} alıcı adını kopyala">${copyIcon} Kopyala</button></div><div class="ibanbox"><p class="label">IBAN</p><div class="iban">${formatted(b.iban)}</div></div><div class="actions"><button class="primary" data-copy="iban" data-bank="${i}">${copyIcon} IBAN’ı Kopyala</button><a class="whatsapp" href="https://wa.me/?text=${encodeURIComponent(b.name+'\nAlıcı: '+owner+'\nIBAN: '+formatted(b.iban))}" target="_blank" rel="noopener noreferrer" aria-label="${b.name} hesap bilgilerini WhatsApp’ta paylaş">${shareIcon} WhatsApp’ta Paylaş</a></div></div></article>`).join('');
let toastTimer;
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
async function copyText(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true}catch(e){}}const field=document.createElement('textarea');field.value=text;field.setAttribute('readonly','');field.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(field);field.focus();field.select();field.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}field.remove();return ok}
document.addEventListener('click',async e=>{const button=e.target.closest('button[data-copy]');if(!button)return;const isName=button.dataset.copy==='name';const ok=await copyText(isName?owner:banks[Number(button.dataset.bank)].iban);notify(ok?(isName?'Alıcı adı kopyalandı':'IBAN kopyalandı'):'Kopyalanamadı. Bilgiye basılı tutarak kopyalayabilirsiniz.');button.focus({preventScroll:true})});
</script></body></html>
